apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volcano
  namespace: prod-lepton
spec:
  interval: 10m
  releaseName: volcano-ascend
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: volcano
      version: "1.9.4"
      sourceRef:
        kind: HelmRepository
        name: volcano-oci
        namespace: prod-lepton
  kubeConfig:
    configMapRef:
      name: 019cb67f-b067-78b2-a209-bcc5b8320c2c
  install:
    createNamespace: false
  upgrade:
    cleanupOnFail: true
  driftDetection:
    mode: warn