apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volcano
  namespace: prod-lepton
spec:
  interval: 10m
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: volcano
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: volcano-oci
        namespace: prod-lepton
  install:
    createNamespace: false
  upgrade:
    cleanupOnFail: true